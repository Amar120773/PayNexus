name: ClusterFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Go Vet (Static Analysis)
        run: |
          cd backend
          go vet ./...

      - name: Run Go Tests
        run: |
          cd backend
          go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Compile Backend Server
        run: |
          cd backend
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -v -o bin/server ./cmd/server/main.go

      - name: Compile Worker Agent
        run: |
          cd backend
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -v -o bin/agent ./cmd/agent/main.go

      - name: Upload Backend Binaries
        uses: actions/upload-artifact@v3
        with:
          name: clusterflow-backend-binaries
          path: backend/bin/

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Client
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Static Assets
        uses: actions/upload-artifact@v3
        with:
          name: clusterflow-frontend-dist
          path: frontend/dist/

  docker-build:
    name: Docker Compilation Checks
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Backend Server Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.server
          push: false

      - name: Verify Scheduler Engine Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.scheduler
          push: false

      - name: Verify Worker Agent Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.agent
          push: false

      - name: Verify Frontend Nginx Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
